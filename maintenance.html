<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Back Soon — Rushil Barve</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <script src="site-config.js"></script>
  <script>
    // If maintenance has been switched off, send visitors back to the site.
    if (!(window.SITE_CONFIG && window.SITE_CONFIG.maintenance)) location.replace("index.html");
  </script>
  <style>
    :root { --bg: #f8fafc; --surface: #fff; --border: #dbe3ee; --text: #0f172a; --muted: #526074; --a1: #3b82f6; --a2: #8b5cf6; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; background: var(--bg); color: var(--text); font-family: "Inter", system-ui, sans-serif; }
    .card { max-width: 520px; width: 100%; text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 2.5rem 2rem; box-shadow: 0 10px 30px rgba(15, 23, 42, .08); }
    .icon { width: 64px; height: 64px; margin: 0 auto 1.2rem; border-radius: 16px; display: grid; place-items: center; background: linear-gradient(135deg, var(--a1), var(--a2)); color: #fff; }
    .eyebrow { font-family: "JetBrains Mono", monospace; font-size: .8rem; color: var(--a1); letter-spacing: .08em; text-transform: uppercase; }
    h1 { font-size: 1.9rem; font-weight: 800; margin: .4rem 0 .8rem; }
    p { color: var(--muted); line-height: 1.6; margin: 0 0 1.4rem; }
    .links { display: flex; flex-wrap: wrap; gap: .6rem; justify-content: center; }
    a { text-decoration: none; font-weight: 600; font-size: .92rem; padding: .65rem 1.1rem; border-radius: 10px; border: 1px solid var(--border); color: var(--text); }
    a.primary { background: linear-gradient(135deg, var(--a1), var(--a2)); color: #fff; border-color: transparent; }
  </style>
</head>
<body>

    </div>

      <a href="https://github.com/Rsk0110" target="_blank" rel="noopener">GitHub</a>
    </div>

</body>
</html>
